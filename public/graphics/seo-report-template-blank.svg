<svg xmlns="http://www.w3.org/2000/svg" width="1275" height="1650" viewBox="0 0 1275 1650" role="img" aria-labelledby="t d"><title id="t">Blank SEO report template</title><desc id="d">Blank one-page SEO report template with seven sections: headline takeaway, key metrics (clicks, impressions, CTR, average position), clicks trend chart, top pages, keyword wins, work completed, and next period plan.</desc><rect x="0" y="0" width="1275" height="1650" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><rect x="70" y="70" width="64" height="64" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><text x="102" y="112" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">LOGO</text><text x="154" y="98" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="start">SEO Report</text><text x="154" y="126" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#64748b" text-anchor="start">Client / site: ______________________</text><rect x="905" y="82" width="300" height="42" rx="21" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><text x="1055" y="109" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">Period: ____________</text><circle cx="84" cy="194" r="14" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="84" y="199" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="108" y="200" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">HEADLINE TAKEAWAY</text><rect x="70" y="218" width="1135" height="110" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><text x="88" y="248" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">ONE SENTENCE</text><text x="88" y="274" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">What changed this period, and why — the line a busy reader remembers if they read nothing else.</text><circle cx="84" cy="374" r="14" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="84" y="379" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="108" y="380" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">KEY METRICS VS PREVIOUS PERIOD</text><rect x="70" y="398" width="271.75" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><text x="88" y="428" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">CLICKS</text><text x="88" y="454" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">This period · Δ vs last</text><line x1="88" y1="526" x2="323.75" y2="526" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><rect x="357.75" y="398" width="271.75" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><text x="375.75" y="428" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">IMPRESSIONS</text><text x="375.75" y="454" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">This period · Δ vs last</text><line x1="375.75" y1="526" x2="611.5" y2="526" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><rect x="645.5" y="398" width="271.75" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><text x="663.5" y="428" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">CTR</text><text x="663.5" y="454" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">This period · Δ vs last</text><line x1="663.5" y1="526" x2="899.25" y2="526" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><rect x="933.25" y="398" width="271.75" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><text x="951.25" y="428" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">AVG POSITION</text><text x="951.25" y="454" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">This period · Δ vs last</text><line x1="951.25" y1="526" x2="1187" y2="526" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><circle cx="84" cy="584" r="14" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="84" y="589" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="108" y="590" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">CLICKS TREND</text><rect x="70" y="608" width="1135" height="300" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><text x="88" y="638" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">CHART</text><text x="88" y="664" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">Plot monthly clicks (and optionally impressions) for the last 6–13 months. Mark anything that explains a jump or dip: launches, migrations,</text><text x="88" y="683.6" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">algorithm updates.</text><circle cx="84" cy="944" r="14" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="84" y="949" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="108" y="950" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">TOP PAGES</text><circle cx="663.5" cy="944" r="14" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="663.5" y="949" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="687.5" y="950" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">KEYWORD WINS</text><rect x="70" y="968" width="555.5" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><text x="88" y="998" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">PAGE · CLICKS · Δ</text><text x="88" y="1024" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">Your 5 highest-click URLs and their change vs last period.</text><line x1="88" y1="1266" x2="607.5" y2="1266" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="88" y1="1232" x2="607.5" y2="1232" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="88" y1="1198" x2="607.5" y2="1198" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="88" y1="1164" x2="607.5" y2="1164" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="88" y1="1130" x2="607.5" y2="1130" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><rect x="649.5" y="968" width="555.5" height="320" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><text x="667.5" y="998" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">QUERY · BEFORE → AFTER</text><text x="667.5" y="1024" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">Queries whose average position improved most. Lead with any that</text><text x="667.5" y="1043.6" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">reached page one.</text><line x1="667.5" y1="1266" x2="1187" y2="1266" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="667.5" y1="1232" x2="1187" y2="1232" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="667.5" y1="1198" x2="1187" y2="1198" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="667.5" y1="1164" x2="1187" y2="1164" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="667.5" y1="1130" x2="1187" y2="1130" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><circle cx="84" cy="1314" r="14" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="84" y="1319" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="108" y="1320" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">WORK COMPLETED</text><circle cx="663.5" cy="1314" r="14" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="663.5" y="1319" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="687.5" y="1320" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">NEXT PERIOD PLAN</text><rect x="70" y="1338" width="555.5" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><text x="88" y="1368" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">SHIPPED</text><text x="88" y="1394" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">What was done, linked to the numbers above where you can.</text><line x1="88" y1="1536" x2="607.5" y2="1536" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="88" y1="1502" x2="607.5" y2="1502" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="88" y1="1468" x2="607.5" y2="1468" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><rect x="649.5" y="1338" width="555.5" height="220" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><text x="667.5" y="1368" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">PLANNED</text><text x="667.5" y="1394" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">Two or three priorities, each tied to a metric you’ll report next</text><text x="667.5" y="1413.6" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">time.</text><line x1="667.5" y1="1536" x2="1187" y2="1536" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="667.5" y1="1502" x2="1187" y2="1502" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="667.5" y1="1468" x2="1187" y2="1468" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="70" y1="1580" x2="1205" y2="1580" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round"/><text x="70" y="1614" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start">Blank SEO report template · WhizGraphs · whizgraphs.com/seo-report-template/</text><text x="1205" y="1614" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#0e7490" text-anchor="end">whizgraphs.com</text></svg>