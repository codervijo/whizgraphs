<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Anatomy of an SEO infographic</title><desc id="d">Annotated SEO infographic showing its six parts: brand and period, headline, three stat tiles with change, one chart, a line of context, and source credit.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><svg x="60" y="50" width="720" height="900" viewBox="0 0 1200 1500"><rect x="0" y="0" width="1200" height="1500" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><defs><radialGradient id="glow-anat" cx="0" cy="0" r="1" gradientTransform="translate(0 0) scale(900 420)" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#0891b2" stop-opacity="0.12"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="1500" fill="url(#glow-anat)"/><rect x="64" y="64" width="64" height="64" rx="14" fill="#0891b2" stroke="none" stroke-width="1.5"/><text x="96" y="106" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">AC</text><text x="148" y="90" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">acme.com</text><text x="148" y="118" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0f172a" text-anchor="start">Traffic Growth</text><rect x="967" y="78" width="169" height="38" rx="19" fill="#f1f5f9" stroke="none" stroke-width="1.5"/><text x="1051.5" y="103" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#64748b" text-anchor="middle">Jan – Aug 2026</text><text x="64" y="230" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#0f172a" text-anchor="start">Search clicks are up 3.4× this</text><text x="64" y="292.1" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#0f172a" text-anchor="start">year.</text><rect x="64" y="384.2" width="344" height="160" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="86" y="420.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="start" letter-spacing="1">CLICKS · AUG</text><text x="86" y="468.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0891b2" text-anchor="start">6.2k</text><text x="86" y="522.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#16a34a" text-anchor="start">+243% vs Jan</text><rect x="428" y="384.2" width="344" height="160" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="450" y="420.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="start" letter-spacing="1">IMPRESSIONS · AUG</text><text x="450" y="468.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0f172a" text-anchor="start">109k</text><text x="450" y="522.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#16a34a" text-anchor="start">+159% vs Jan</text><rect x="792" y="384.2" width="344" height="160" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="814" y="420.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#94a3b8" text-anchor="start" letter-spacing="1">CTR</text><text x="814" y="468.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#0f172a" text-anchor="start">5.7%</text><text x="814" y="522.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#16a34a" text-anchor="start">+1.4pp vs Jan</text><rect x="64" y="584.2" width="1072" height="675.8" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="92" y="628.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#334155" text-anchor="start">Monthly clicks from Google Search</text><line x1="154" y1="1190" x2="1096" y2="1190" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="142" y="1195" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="end">0</text><line x1="154" y1="1061.05" x2="1096" y2="1061.05" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="142" y="1066.05" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="end">2k</text><line x1="154" y1="932.1" x2="1096" y2="932.1" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="142" y="937.1" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="end">4k</text><line x1="154" y1="803.1500000000001" x2="1096" y2="803.1500000000001" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="142" y="808.1500000000001" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="end">6k</text><line x1="154" y1="674.2" x2="1096" y2="674.2" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="142" y="679.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="end">8k</text><defs><linearGradient id="lc-anat" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="#0891b2" stop-opacity="0.28"/><stop offset="100%" stop-color="#0891b2" stop-opacity="0"/></linearGradient></defs><path d="M154.0,1072.7 L288.6,1054.0 L423.1,1030.1 L557.7,999.8 L692.3,956.6 L826.9,912.1 L961.4,856.0 L1096.0,787.7 L1096,1190 L154,1190 Z" fill="url(#lc-anat)"/><path d="M154.0,1072.7 L288.6,1054.0 L423.1,1030.1 L557.7,999.8 L692.3,956.6 L826.9,912.1 L961.4,856.0 L1096.0,787.7" fill="none" stroke="#0891b2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="154" cy="1072.6555" r="5" fill="#0891b2" stroke="none" stroke-width="1.5"/><circle cx="288.57142857142856" cy="1053.95775" r="5" fill="#0891b2" stroke="none" stroke-width="1.5"/><circle cx="423.14285714285717" cy="1030.102" r="5" fill="#0891b2" stroke="none" stroke-width="1.5"/><circle cx="557.7142857142858" cy="999.79875" r="5" fill="#0891b2" stroke="none" stroke-width="1.5"/><circle cx="692.2857142857143" cy="956.6005" r="5" fill="#0891b2" stroke="none" stroke-width="1.5"/><circle cx="826.8571428571429" cy="912.11275" r="5" fill="#0891b2" stroke="none" stroke-width="1.5"/><circle cx="961.4285714285714" cy="856.0195000000001" r="5" fill="#0891b2" stroke="none" stroke-width="1.5"/><circle cx="1096" cy="787.676" r="5" fill="#0891b2" stroke="none" stroke-width="1.5"/><text x="154" y="1218" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle">Jan</text><text x="288.57142857142856" y="1218" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle">Feb</text><text x="423.14285714285717" y="1218" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle">Mar</text><text x="557.7142857142858" y="1218" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle">Apr</text><text x="692.2857142857143" y="1218" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle">May</text><text x="826.8571428571429" y="1218" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle">Jun</text><text x="961.4285714285714" y="1218" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle">Jul</text><text x="1096" y="1218" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle">Aug</text><text x="64" y="1350" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#334155" text-anchor="start">Long-form guides published in Q2 account for most of the gain.</text><line x1="64" y1="1408" x2="1136" y2="1408" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round"/><text x="64" y="1448" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" text-anchor="start">Sample data · fictional site</text><text x="1136" y="1448" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#0891b2" text-anchor="end">Made with WhizGraphs · whizgraphs.com</text></svg><line x1="788" y1="107.6" x2="836" y2="110" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 6"/><circle cx="788" cy="107.6" r="6" fill="#0891b2" stroke="none" stroke-width="1.5"/><circle cx="860" cy="110" r="22" fill="#0891b2" stroke="none" stroke-width="1.5"/><text x="860" y="117" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="900" y="118" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Brand &amp; period</text><text x="900" y="152" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Logo, site, and the date range — the reader knows whose data and</text><text x="900" y="177.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">when.</text><line x1="788" y1="206" x2="836" y2="250" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 6"/><circle cx="788" cy="206" r="6" fill="#0891b2" stroke="none" stroke-width="1.5"/><circle cx="860" cy="250" r="22" fill="#0891b2" stroke="none" stroke-width="1.5"/><text x="860" y="257" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="900" y="258" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Headline</text><text x="900" y="292" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">The takeaway as a sentence. If they read nothing else, they read</text><text x="900" y="317.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">this.</text><line x1="788" y1="308" x2="836" y2="390" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 6"/><circle cx="788" cy="308" r="6" fill="#0891b2" stroke="none" stroke-width="1.5"/><circle cx="860" cy="390" r="22" fill="#0891b2" stroke="none" stroke-width="1.5"/><text x="860" y="397" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="900" y="398" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Three stat tiles</text><text x="900" y="432" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">The numbers that matter, each with its change — never a bare total.</text><line x1="788" y1="518" x2="836" y2="530" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 6"/><circle cx="788" cy="518" r="6" fill="#0891b2" stroke="none" stroke-width="1.5"/><circle cx="860" cy="530" r="22" fill="#0891b2" stroke="none" stroke-width="1.5"/><text x="860" y="537" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="900" y="538" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">One chart</text><text x="900" y="572" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">A single visual that carries the argument. One question per image.</text><line x1="788" y1="860" x2="836" y2="670" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 6"/><circle cx="788" cy="860" r="6" fill="#0891b2" stroke="none" stroke-width="1.5"/><circle cx="860" cy="670" r="22" fill="#0891b2" stroke="none" stroke-width="1.5"/><text x="860" y="677" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="900" y="678" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">A line of context</text><text x="900" y="712" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Why it moved, in plain words — the part a chart can’t say.</text><line x1="788" y1="914" x2="836" y2="810" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 6"/><circle cx="788" cy="914" r="6" fill="#0891b2" stroke="none" stroke-width="1.5"/><circle cx="860" cy="810" r="22" fill="#0891b2" stroke="none" stroke-width="1.5"/><text x="860" y="817" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="900" y="818" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#0f172a" text-anchor="start">Source &amp; credit</text><text x="900" y="852" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Where the data came from, so the image stands alone when forwarded.</text></svg>