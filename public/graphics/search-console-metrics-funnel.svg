<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">How Google Search Console counts impressions, clicks, CTR and position</title><desc id="d">Funnel diagram: a search happens, your page earns an impression when it appears in results, and a click when the user visits. CTR equals clicks divided by impressions; average position is the mean of your topmost position per impression.</desc><rect x="0" y="0" width="1600" height="900" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1600" height="900" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="80" y="100" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#0f172a" text-anchor="start">How Search Console counts your search performance</text><rect x="80" y="170" width="1000" height="150" rx="18" fill="#e2e8f0" stroke="none" stroke-width="1.5"/><text x="580" y="236" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#334155" text-anchor="middle">Someone searches</text><text x="580" y="278" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="middle">Google runs a query. Not every query shows your site.</text><rect x="190" y="370" width="780" height="150" rx="18" fill="#0891b255" stroke="none" stroke-width="1.5"/><text x="580" y="436" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#0f172a" text-anchor="middle">Impression</text><text x="580" y="478" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#0f172a" text-anchor="middle">A link to your page appears in the results the user sees.</text><rect x="320" y="570" width="520" height="150" rx="18" fill="#0891b2" stroke="none" stroke-width="1.5"/><text x="580" y="636" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#ffffff" text-anchor="middle">Click</text><text x="580" y="678" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#ffffff" text-anchor="middle">The user clicks through to your site.</text><rect x="1160" y="170" width="360" height="230" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="1188" y="220" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#0891b2" text-anchor="start">CTR</text><text x="1188" y="262" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Clicks ÷ impressions</text><text x="1188" y="330" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">The share of people who saw your</text><text x="1188" y="351" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">result and chose it.</text><rect x="1160" y="430" width="360" height="230" rx="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text x="1188" y="480" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#0891b2" text-anchor="start">Average position</text><text x="1188" y="522" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">Mean of your topmost</text><text x="1188" y="550" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0f172a" text-anchor="start">position per impression</text><text x="1188" y="590" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">Lower is better; 1 is the top result.</text><text x="80" y="820" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#64748b" text-anchor="start">Each metric can be split by query, page, country, device, search appearance and date — the raw material for every SEO infographic.</text></svg>