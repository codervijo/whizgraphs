<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Mapping Search Console Performance data to SEO infographic templates</title><desc id="d">Diagram mapping the Google Search Console Performance report tabs — Dates, Queries, Pages, Countries and Devices — to WhizGraphs templates: Traffic Growth, Keyword Wins and CTR Opportunities, Top Pages and Content Performance, and Audience Mix.</desc><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><text x="80" y="96" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#0f172a" text-anchor="start">From the Search Console Performance report to an infographic</text><text x="80" y="170" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">SEARCH CONSOLE · PERFORMANCE</text><text x="960" y="170" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">WHIZGRAPHS TEMPLATE</text><rect x="80" y="200" width="560" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="110" y="262" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="start">Dates tab</text><text x="110" y="304" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Clicks, impressions, CTR, position per day</text><rect x="960" y="200" width="560" height="150" rx="18" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/><text x="990" y="262" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0891b2" text-anchor="start">Traffic Growth</text><text x="990" y="304" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Trend line + headline totals</text><line x1="660" y1="275" x2="940" y2="275" stroke="#0891b2" stroke-width="2" stroke-linecap="round"/><path d="M940,275 L929.2,269.8 L929.2,280.2 Z" fill="#0891b2"/><rect x="80" y="390" width="560" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="110" y="452" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="start">Queries tab</text><text x="110" y="494" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">The searches that showed your site</text><rect x="960" y="390" width="560" height="150" rx="18" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/><text x="990" y="452" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0891b2" text-anchor="start">Keyword Wins · CTR Opportunities</text><text x="990" y="494" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Position moves and under-clicked queries</text><line x1="660" y1="465" x2="940" y2="465" stroke="#0891b2" stroke-width="2" stroke-linecap="round"/><path d="M940,465 L929.2,459.8 L929.2,470.2 Z" fill="#0891b2"/><rect x="80" y="580" width="560" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="110" y="642" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="start">Pages tab</text><text x="110" y="684" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Which URLs earned the clicks</text><rect x="960" y="580" width="560" height="150" rx="18" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/><text x="990" y="642" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0891b2" text-anchor="start">Top Pages · Content Performance</text><text x="990" y="684" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Contribution and CTR vs rank by URL</text><line x1="660" y1="655" x2="940" y2="655" stroke="#0891b2" stroke-width="2" stroke-linecap="round"/><path d="M940,655 L929.2,649.8 L929.2,660.2 Z" fill="#0891b2"/><rect x="80" y="770" width="560" height="150" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text x="110" y="832" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0f172a" text-anchor="start">Countries &amp; Devices tabs</text><text x="110" y="874" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Where and how people searched</text><rect x="960" y="770" width="560" height="150" rx="18" fill="#ffffff" stroke="#0891b2" stroke-width="2.5"/><text x="990" y="832" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0891b2" text-anchor="start">Audience Mix</text><text x="990" y="874" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Device and country split</text><line x1="660" y1="845" x2="940" y2="845" stroke="#0891b2" stroke-width="2" stroke-linecap="round"/><path d="M940,845 L929.2,839.8 L929.2,850.2 Z" fill="#0891b2"/></svg>