<svg xmlns="http://www.w3.org/2000/svg" width="1275" height="1650" viewBox="0 0 1275 1650" role="img" aria-labelledby="t d"><title id="t">SEO reporting framework: weekly, monthly, quarterly</title><desc id="d">SEO reporting framework showing three cadences — weekly pulse for the in-house team, monthly report for clients or managers, quarterly review for executives — with the question each answers, its KPIs, format and starting template, plus a five-step reporting workflow.</desc><rect x="0" y="0" width="1275" height="1650" rx="0" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="70" y="104" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#0f172a" text-anchor="start">SEO reporting framework</text><text x="70" y="146" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">Three cadences, each with its own audience, question, and KPI set. Report the same numbers to everyone and nobody gets</text><text x="70" y="171.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#64748b" text-anchor="start">what they need.</text><rect x="70" y="230" width="1135" height="330" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="70" y="230" width="14" height="330" rx="7" fill="#0e7490" stroke="none" stroke-width="1.5" fill-opacity="1"/><text x="110" y="282" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="start">Weekly pulse</text><text x="1175" y="282" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#0e7490" text-anchor="end">In-house SEO / content team</text><text x="110" y="326" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="1">ANSWERS</text><text x="110" y="354" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start" font-style="italic">“Did anything break or spike this week?”</text><text x="110" y="402" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="1">KPIS</text><circle cx="116" cy="425.7" r="4" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="132" y="432" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Clicks &amp; impressions, week over week</text><circle cx="116" cy="460.9" r="4" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="132" y="467.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Pages newly losing clicks</text><circle cx="116" cy="496.09999999999997" r="4" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="132" y="502.4" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Indexing &amp; crawl errors</text><text x="810" y="402" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="1">FORMAT</text><text x="810" y="432" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">3–5 bullet message in Slack or email</text><text x="810" y="492" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="1">START FROM</text><text x="810" y="520" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#0e7490" text-anchor="start">SEO dashboard template</text><rect x="70" y="584" width="1135" height="330" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><rect x="70" y="584" width="14" height="330" rx="7" fill="#0e7490" stroke="none" stroke-width="1.5" fill-opacity="0.75"/><text x="110" y="636" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="start">Monthly report</text><text x="1175" y="636" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#0e7490" text-anchor="end">Client, manager, or stakeholder</text><text x="110" y="680" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="1">ANSWERS</text><text x="110" y="708" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#334155" text-anchor="start" font-style="italic">“Is SEO working, and what are you doing next?”</text><text x="110" y="756" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="1">KPIS</text><circle cx="116" cy="779.7" r="4" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="132" y="786" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Clicks, impressions, CTR, avg position (MoM + YoY)</text><circle cx="116" cy="814.9000000000001" r="4" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="132" y="821.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Top pages &amp; keyword wins</text><circle cx="116" cy="850.1000000000001" r="4" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="132" y="856.40000