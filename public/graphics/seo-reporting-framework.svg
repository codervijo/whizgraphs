1110" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="1">KPIS</text><circle cx="116" cy="1133.7" r="4" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="132" y="1140" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Non-brand clicks vs target</text><circle cx="116" cy="1168.9" r="4" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="132" y="1175.2" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Conversions or leads from organic</text><circle cx="116" cy="1204.1000000000001" r="4" fill="#0e7490" stroke="none" stroke-width="1.5"/><text x="132" y="1210.4" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Strategic bets: kept, cut, added</text><text x="810" y="1110" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="1">FORMAT</text><text x="810" y="1140" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#334155" text-anchor="start">Short deck or one-page snapshot</text><text x="810" y="1200" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="start" letter-spacing="1">START FROM</text><text x="810" y="1228" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="18" font-weight="600" fill="#0e7490" text-anchor="start">SEO report template</text><text x="70" y="1322" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="start" letter-spacing="1">EVERY REPORT, EVE