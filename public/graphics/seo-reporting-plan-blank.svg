ill="#ffffff" text-anchor="start">Target / goal</text><text x="1036" y="260" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="start">Owner</text><rect x="70" y="284" width="1135" height="70" rx="0" fill="#f8fafc" stroke="none" stroke-width="1.5"/><line x1="290" y1="284" x2="290" y2="354" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="450" y1="284" x2="450" y2="354" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="580" y1="284" x2="580" y2="354" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="800" y1="284" x2="800" y2="354" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><line x1="1020" y1="284" x2="1020" y2="354" stroke="#e2e8f0" stroke-width="1" stroke-linecap="round"/><text x="86" y="326" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">Non-brand clicks</text><text x="306" y="326" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">Client</text><text x="466" y="326" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">Monthly</text><text x="596" y="326" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">GSC · query filter</text><text x="816" y="326" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="italic">Agreed with client</text><text x="1036" y="326" font-family="Inter, 'Liberation Sans', Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#94a3b8" text-anchor="start" font-style="ital